[package]
name = "indradb-mayhem-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone crate under mayhem/ — MUST declare its own empty [workspace] table or
# cargo errors that it "believes it's in a workspace when it's not" against the
# upstream root Cargo.toml (which lists lib/proto/server/client/plugins/* as
# members and must never be edited). This crate is intentionally NOT a member of
# that workspace.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = "0.4"
serde_json = "1"
uuid = "1"

# The dependency key matches the package name (lib/Cargo.toml [package] name =
# "indradb-lib"); the compiled crate's actual name, and thus what code `use`s,
# is "indradb" per lib/Cargo.toml's [lib] name = "indradb" override (same as
# upstream's own lib/fuzz/Cargo.toml). default-features = false keeps the
# rocksdb-datastore feature OFF: both fuzz targets below exercise only the pure
# in-memory MemoryDatastore (no file I/O, no persistent backend) per the
# porting brief.
[dependencies.indradb-lib]
path = "../../lib"
default-features = false

[[bin]]
name = "ops"
path = "fuzz_targets/ops.rs"
test = false
doc = false
bench = false

[[bin]]
name = "identifier"
path = "fuzz_targets/identifier.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
