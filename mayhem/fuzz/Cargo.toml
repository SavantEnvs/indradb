[package]
name = "indradb-mayhem-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone crate under mayhem/ — MUST declare its own empty [workspace] table or
# cargo errors that it "believes it's in a workspace when it's not" against the
# upstream root Cargo.toml (which lists lib/proto/server/client/plugins/* as
# members and must never be edited). This crate is intentionally NOT a member of
# that workspace.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
libfuzzer-sys = "0.4"
serde_json = "1"
uuid = "1"
tempfile = "^3.2.0"

# The dependency key matches the package name (lib/Cargo.toml [package] name =
# "indradb-lib"); the compiled crate's actual name, and thus what code `use`s,
# is "indradb" per lib/Cargo.toml's [lib] name = "indradb" override (same as
# upstream's own lib/fuzz/Cargo.toml). rocksdb-datastore is enabled here (unlike
# the live port) because the `compare` backport target below is upstream's own
# differential MemoryDatastore-vs-RocksdbDatastore harness, verbatim — the bug
# this branch reproduces lives on the Rocksdb side.
[dependencies.indradb-lib]
path = "../../lib"
default-features = false
features = ["rocksdb-datastore"]

[[bin]]
name = "compare"
path = "fuzz_targets/compare.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
