[package]
name = "indradb-mayhem-fuzz"
version = "0.0.0"
edition = "2021"
publish = false

# Standalone crate under mayhem/ — MUST declare its own empty [workspace] table or
# cargo errors that it "believes it's in a workspace when it's not" against the
# upstream root Cargo.toml (which lists lib/proto/server/client/plugins/* as
# members and must never be edited). This crate is intentionally NOT a member of
# that workspace.
[workspace]

[package.metadata]
cargo-fuzz = true

# arbitrary/libfuzzer-sys pinned to the EXACT versions upstream's own
# lib/fuzz/Cargo.lock locked at UPSTREAM: `Arbitrary`'s byte-to-value decoding
# is not semver-stable across its 1.x line (only the API is), so a newer
# arbitrary silently reinterprets the mayhemheroes run's crashers into
# different values and the original bug stops reproducing (BACKPORT.md's
# "Input-interface caveat").
[dependencies]
arbitrary = { version = "=1.2.0", features = ["derive"] }
# derive_arbitrary isn't version-locked to `arbitrary` by Cargo's resolver on
# its own (it's a separate crate); pin it too or it floats to latest and the
# derived impls call trait methods 1.2.0 doesn't have (try_size_hint, added later).
derive_arbitrary = "=1.2.0"
libfuzzer-sys = "=0.4.5"
serde_json = "1"
uuid = "1"
tempfile = "3"

# The dependency key matches the package name (lib/Cargo.toml [package] name =
# "indradb-lib"); the compiled crate's actual name, and thus what code `use`s,
# is "indradb" per lib/Cargo.toml's [lib] name = "indradb" override (same as
# upstream's own lib/fuzz/Cargo.toml). This backport target is upstream's own
# differential MemoryDatastore-vs-RocksdbDatastore comparison fuzzer
# (lib/fuzz/fuzz_targets/compare.rs at UPSTREAM, copied verbatim), so it needs
# the rocksdb-datastore feature live, unlike the dropped live `ops`/`identifier`
# targets.
[dependencies.indradb-lib]
path = "../../lib"
default-features = false
features = ["rocksdb-datastore"]

[[bin]]
name = "compare"
path = "fuzz_targets/compare.rs"
test = false
doc = false
bench = false

[profile.release]
debug = 1
